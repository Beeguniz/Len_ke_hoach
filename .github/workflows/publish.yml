
name: Publish Docker Images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskboard-publish
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: Test, Build and Push
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskboard_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d taskboard_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://test:disposable-test-only@127.0.0.1:5432/taskboard_test

    steps:
      # 1. Lay source code tu GitHub
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Cai dat Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 3. Cai dat dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Chay tests
      - name: Run tests
        run: npm test

      # 5. Build ung dung
      - name: Build application
        run: npm run build

      # 6. Cau hinh Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 7. Dang nhap Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Build va push Backend image
      - name: Build and push Backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: quyphu123/backend:sha-${{ github.sha }}

      # 9. Build va push Frontend image
      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          build-args: |
            APP_VERSION=v2-sha-${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: quyphu123/frontend:sha-${{ github.sha }}
