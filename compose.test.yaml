services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskboard_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: disposable-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d taskboard_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  test:
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgres://test:disposable-test-only@test-db:5432/taskboard_test
    depends_on:
      test-db:
        condition: service_healthy
